# Contributor path: build the image from this checkout and run it.
#
#   JEV_DASHBOARD_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" \
#     docker compose -f docker-compose.build.yml up --build -d
#   docker logs jev-dashboard        # the URL (and the generated token, if unset)
#
# For the published image (the deploy path), use docker-compose.yml instead.
# Everything else mirrors docker-compose.yml; only `build:` / `image:` differ,
# and the repo at ./my-project must already be a git repo (plain `git init`
# is enough; `jev init` is optional).

services:
  jev:
    build: .
    image: jev-dashboard:latest
    container_name: jev-dashboard
    # Published on loopback only: the dashboard speaks plain HTTP. For remote
    # access use `ssh -L 8765:127.0.0.1:8765 <host>` or a TLS reverse proxy.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      JEV_PORT: "8765"
      # JEV_DASHBOARD_TOKEN: "replace-me-with-a-long-random-token"
    volumes:
      - ./my-project:/data # the git repo jev serves (plain `git init` is enough)
    restart: unless-stopped
