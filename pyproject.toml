[project]
name = "baton-agent-orchestrator"
version = "0.2.0"
description = "Turn an idea into reviewed, tested code with a pipeline of AI agents dispatched by Jev."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gane2506" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "markupsafe>=2.1",  # imported directly (dashboard rendering), not only through jinja2
    "httpx>=0.27",
]

[project.scripts]
jev = "jev_agent.cli.app:main"
baton-agent-orchestrator = "jev_agent.cli.app:main"

[project.optional-dependencies]
dashboard = [
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.18",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["PLAN.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples/demo"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x prefers httpx2 for its test client; httpx (a core dependency) works.
    "ignore:Using `httpx` with `starlette.testclient`",
]
