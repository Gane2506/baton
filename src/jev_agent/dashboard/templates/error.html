{% extends "base.html" %}
{% from "macros.html" import icon with context %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="focus-page error-page">
  <section class="panel">
    {{ icon("i-alert", "lg") }}
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="actions"><a class="button" href="/">{{ icon("i-board", "sm") }}Back to the board</a></div>
  </section>
</div>
{% endblock %}
